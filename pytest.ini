# pytest.ini — project root me rakho (jahan tests/ aur pages/ folder hain)

[pytest]
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --durations=10
    --html=reports/pytest-report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/pytest-report.json
    --json-report-indent=2

markers =
    smoke: quick sanity tests, run on every PR
    regression: full suite, nightly only
    slow: takes more than 30 seconds
    flaky: known unstable, needs investigation

filterwarnings =
    ignore::DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S